
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEZLY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#090909;color:#fff;font-family:Arial;text-align:center;padding:25px}
h1{color:#e5c16b;letter-spacing:5px;font-size:38px}
.crown{font-size:48px;color:#e5c16b}
.card{max-width:420px;margin:20px auto;background:#171717;border:1px solid #a8863d;border-radius:18px;padding:22px}
input{display:block;width:90%;margin:12px auto;padding:13px;border-radius:9px;border:1px solid #a8863d;background:#080808;color:white;font-size:15px}
button{width:95%;padding:13px;margin:7px;border:0;border-radius:9px;background:#dfbd68;color:#17120a;font-weight:bold;font-size:15px}
.secondary{background:#333;color:#f1d78d}
.gold{color:#e5c16b}
small{color:#aaa}
.hidden{display:none}
</style>
</head>
<body>
<div class="crown">♛</div>
<h1>FLEZLY</h1>
<p class="gold">GIOCA • COMPLETA • GUADAGNA</p>

<div class="card" id="access">
<h2 class="gold">Benvenuto in FLEZLY</h2>
<input id="email" type="email" placeholder="La tua email">
<input id="password" type="password" placeholder="La tua password">
<button onclick="register()">REGISTRATI</button>
<button class="secondary" onclick="login()">ACCEDI</button><button type="button" onclick="resetPassword()">Password dimenticata?</button>
<p id="message"></p><div id="newPasswordBox" class="hidden">
  <input id="newPassword" type="password" placeholder="Nuova password">
  <button type="button" onclick="saveNewPassword()">SALVA NUOVA PASSWORD</button>
</div>
<small>Usa la tua email vera per confermare la registrazione.</small>
</div>

<div class="card hidden" id="account">
<h2 class="gold">Il tuo account FLEZLY</h2>
<p id="user"></p>
<hr>
<h3 class="gold">IL TUO PORTAFOGLIO</h3>
<p>CS: <b>0</b></p>
<p>Saldo: <b>0,00 €</b></p>
<p><small>I premi non sono ancora attivi.</small></p>
<button class="secondary" onclick="logout()">ESCI</button>
</div>

<script>
const SUPABASE_URL = "https://fmboclbkxozjlopcmmzs.supabase.co";
const SUPABASE_KEY = "sb_publishable_nXlpcKw9caMut0Lzao0ZaQ_tbUMKcBM";

let db = null;

if(window.supabase &&
   SUPABASE_URL.startsWith("https://") &&
   SUPABASE_KEY.startsWith("sb_publishable_")){
  db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  db.auth.getSession().then(({data})=>showAccount(data.session));
  db.auth.onAuthStateChange((_event,session)=>showAccount(session));
}
db.auth.onAuthStateChange((event, session) => {
  showAccount(session);
  if (event === "PASSWORD_RECOVERY") {
  document.getElementById("message").textContent =
    "Inserisci la nuova password nella schermata di recupero.";

  document.getElementById("newPasswordBox").classList.remove("hidden");
  document.getElementById("newPassword").value = "";
  });
function message(text){
 document.getElementById("message").textContent=text;
}

async function register(){
 if(!db){message("Configurazione Supabase da completare.");return;}
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email || password.length<6){message("Inserisci email e password di almeno 6 caratteri.");return;}
 message("Registrazione in corso...");
 const {error}=await db.auth.signUp({
  email,password,
  options:{emailRedirectTo:window.location.origin+window.location.pathname}
 });
 message(error ? error.message : "Registrazione inviata! Controlla la tua email per confermare.");
}

async function login(){
 if(!db){message("Configurazione Supabase da completare.");return;}
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 message(error ? error.message : "Accesso effettuato!");
}async function resetPassword(){
  if(!db){
    message("Configurazione Supabase da completare.");
    return;
  }

  const email = document.getElementById("email").value.trim();

  if(!email){
    message("Inserisci prima la tua email.");
    return;
  }

  message("Invio richiesta di recupero...");

  const {error} = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });

  message(error
    ? error.message
    : "Email di recupero inviata! Controlla anche Spam.");
}

async function saveNewPassword(){
  const password = document.getElementById("newPassword").value;

  if(password.length < 6){
    message("La password deve avere almeno 6 caratteri.");
    return;
  }

  const {error} = await db.auth.updateUser({password});

  if(error){
    message("Errore: " + error.message);
  } else {
    message("Password aggiornata! Ora puoi accedere.");
    document.getElementById("newPasswordBox").classList.add("hidden");
  }
  }async function logout(){
 if(db) await db.auth.signOut();
}


 
async function showAccount(session){
  const logged = !!session?.user;

  document.getElementById("access").classList.toggle("hidden", logged);
  document.getElementById("account").classList.toggle("hidden", !logged);

  if(logged){
    document.getElementById("user").textContent = session.user.email;

    const {data, error} = await db
      .from("wallets")
      .select("points, balance_cents")
      .eq("user_id", session.user.id)
      .single();

    if(error){
      console.error("Errore portafoglio:", error);
      return;
    }

    document.getElementById("points").textContent = data.points;
    document.getElementById("balance").textContent =
      (data.balance_cents / 100).toFixed(2).replace(".", ",") + " €";
  }
}

}
</script>
</body>
</ht<p>CS: <b id="points">0</b></p>

<p>Saldo: <b id="balance">0,00 €</b></p>ml>
